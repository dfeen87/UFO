name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    name: Build & Test (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov flake8 mypy build

      - name: Lint (flake8)
        run: |
          flake8 .

      - name: Type Check (mypy)
        run: |
          mypy .

      - name: Run Tests (pytest)
        run: |
          pytest --cov=radial_membrane_ai --cov-report=xml --cov-report=term

      - name: Build package
        run: |
          python -m build

      - name: Verify installed package and CLI
        run: |
          python -c "import radial_membrane_ai; assert radial_membrane_ai.__version__ == '5.0.0'"
          test "$(ufo --version)" = "UFO 5.0.0"
          ufo --help

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
