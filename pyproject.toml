[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "radial_membrane_ai"
version = "5.0.0"
description = "A governed deformable radial membrane model for compute-aware AI personalization"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "sympy>=1.12",
    "networkx>=3.2",
    "pydantic>=2.7",
    "typing_extensions>=4.12",
    "matplotlib"
]

[project.scripts]
ufo = "ufo_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["radial_membrane_ai*"]

[tool.setuptools]
py-modules = ["ufo_cli"]

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (>=2.3.0,<3.0.0)"
]
